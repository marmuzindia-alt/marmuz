<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marmuz Admin Login</title><style>body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(92vw,430px);padding:30px;border:1px solid #2b2b2b;border-radius:22px;background:#0d0f10}h1{margin:0 0 8px}.muted{color:#9da3a0}.field{margin:16px 0}label{display:block;font-size:13px;margin-bottom:7px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #363a38;background:#151817;color:#fff;box-sizing:border-box}button{width:100%;padding:13px;border:0;border-radius:10px;background:#ef2029;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px;color:#ffb4b8;font-size:14px}a{color:#fff}</style></head><body><main class="box"><div class="muted">MARMUZ</div><h1>Admin Login</h1><p class="muted">Content dashboard for Marmuz.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="login">Sign in</button><div id="msg" class="msg"></div><p class="muted" style="margin-top:20px"><a href="index.html">← Back to Marmuz</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const cfg=window.MARMUZ_SUPABASE||{};const msg=document.getElementById('msg');document.getElementById('login').onclick=async()=>{msg.textContent='';if(!cfg.url||cfg.url.includes('YOUR_')){msg.textContent='Add your Supabase URL and publishable/anon key to config.js first.';return}const sb=supabase.createClient(cfg.url,cfg.publishableKey);const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent=error.message;return}window.location.href='admin.html'};</script></body></html>
