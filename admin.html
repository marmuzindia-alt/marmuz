<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marmuz Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f5;font-family:Arial,sans-serif}.wrap{width:min(1100px,94vw);margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #242626;padding-bottom:18px}.brand{font-weight:900;letter-spacing:.12em}.btn{border:1px solid #343838;background:#111;color:#fff;border-radius:9px;padding:10px 14px;cursor:pointer}.btn.primary{background:#ef2029;border-color:#ef2029}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:22px}.card{border:1px solid #242727;background:#0d0f10;border-radius:18px;padding:20px}.field{margin:12px 0}label{display:block;font-size:12px;color:#9fa3a6;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border:1px solid #343838;border-radius:9px;background:#151817;color:#fff}textarea{min-height:90px;resize:vertical}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;justify-content:space-between;gap:12px;padding:13px;border-top:1px solid #242727}.small{font-size:12px;color:#9fa3a6}.pill{font-size:11px;padding:4px 8px;border-radius:999px;background:#222}.danger{color:#ff8b91}.hidden{display:none}.notice{padding:12px;border-radius:10px;background:#161918;color:#b9c1bd;margin-top:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">MARMUZ</div><h1 style="margin:8px 0 0">Admin Dashboard</h1></div><div class="row"><button class="btn" id="home">Website</button><button class="btn" id="logout">Logout</button></div></div><div id="gate" class="card" style="margin-top:22px"><h2>Admin authentication</h2><p class="small">Checking Supabase session and admin role…</p></div><section id="dash" class="hidden"><div class="grid"><div class="card"><h2>Add lecture</h2><div class="field"><label>Title</label><input id="ltitle"></div><div class="field"><label>Subject</label><input id="lsubject" placeholder="Microeconomics"></div><div class="field"><label>Topic</label><input id="ltopic" placeholder="Consumer Theory"></div><div class="field"><label>YouTube URL</label><input id="lyoutube" placeholder="https://www.youtube.com/watch?v=..."></div><label><input id="lpublished" type="checkbox" checked style="width:auto"> Publish now</label><p><button class="btn primary" id="addLecture">Add lecture</button></p></div><div class="card"><h2>Add Marmuz Explain</h2><div class="field"><label>Title</label><input id="etitle"></div><div class="field"><label>Subject</label><input id="esubject" placeholder="Microeconomics"></div><div class="field"><label>Topic</label><input id="etopic" placeholder="Basic Concepts"></div><div class="field"><label>YouTube URL</label><input id="eyoutube" placeholder="https://www.youtube.com/watch?v=..."></div><div class="field"><label>Description</label><textarea id="edescription" placeholder="Short explanation of the concept"></textarea></div><label><input id="epublished" type="checkbox" checked style="width:auto"> Publish now</label><p><button class="btn primary" id="addExplain">Add Explain</button></p></div><div class="card"><h2>Add resource</h2><div class="field"><label>Title</label><input id="rtitle"></div><div class="field"><label>Subject</label><input id="rsubject" placeholder="Public Finance"></div><div class="field"><label>Type</label><select id="rtype"><option>PDF</option><option>Notes</option><option>Revision</option><option>Mind Map</option><option>MCQ</option></select></div><div class="field"><label>Resource URL</label><input id="rurl" placeholder="https://..."></div><label><input id="rpublished" type="checkbox" checked style="width:auto"> Publish now</label><p><button class="btn primary" id="addResource">Add resource</button></p></div></div><div class="grid"><div class="card"><h2>Lectures</h2><div id="lectures"></div></div><div class="card"><h2>Marmuz Explains</h2><div id="explains"></div></div><div class="card"><h2>Resources</h2><div id="resources"></div></div></div><div id="msg" class="notice"></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const cfg=window.MARMUZ_SUPABASE||{};const gate=document.getElementById('gate'),dash=document.getElementById('dash'),msg=document.getElementById('msg');let sb;function say(x){msg.textContent=x}function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function boot(){if(!cfg.url||cfg.url.includes('YOUR_')){gate.innerHTML='<h2>Supabase not configured</h2><p class="small">Edit config.js with your Supabase URL and publishable/anon key.</p>';return}sb=supabase.createClient(cfg.url,cfg.publishableKey);const {data:{session}}=await sb.auth.getSession();if(!session){gate.innerHTML='<h2>Login required</h2><p><a href="login.html" style="color:#fff">Open admin login →</a></p>';return}const {data:profile,error}=await sb.from('profiles').select('role,email').eq('id',session.user.id).single();if(error||!profile||profile.role!=='admin'){await sb.auth.signOut();gate.innerHTML='<h2>Access denied</h2><p class="small">This Supabase user is not marked as an admin.</p>';return}gate.classList.add('hidden');dash.classList.remove('hidden');loadAll()}async function loadAll(){const [l,e,r]=await Promise.all([sb.from('lectures').select('*').order('created_at',{ascending:false}),sb.from('explains').select('*').order('created_at',{ascending:false}),sb.from('resources').select('*').order('created_at',{ascending:false})]);if(l.error)say(l.error.message);if(e.error)say('Run the updated schema.sql in Supabase to enable Marmuz Explains.');renderList('lectures',l.data||[],'lecture');renderList('explains',e.data||[],'explain');renderList('resources',r.data||[],'resource')}function renderList(id,rows,type){const box=document.getElementById(id);if(!rows.length){box.innerHTML='<div class="small">No records yet.</div>';return}box.innerHTML=rows.map(x=>`<div class="item"><div><strong>${esc(x.title)}</strong><div class="small">${esc(x.subject||'')} ${x.topic?'• '+esc(x.topic):''} <span class="pill">${x.published?'published':'draft'}</span></div></div><button class="btn danger" data-del="${type}" data-id="${x.id}">Delete</button></div>`).join('');box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeRow(b.dataset.del,b.dataset.id))}async function removeRow(type,id){if(!confirm('Delete this item?'))return;const table=type==='lecture'?'lectures':type==='explain'?'explains':'resources';const {error}=await sb.from(table).delete().eq('id',id);if(error)say(error.message);else{say('Deleted.');loadAll()}}document.getElementById('addLecture').onclick=async()=>{const row={title:ltitle.value.trim(),subject:lsubject.value.trim(),topic:ltopic.value.trim(),youtube_url:lyoutube.value.trim(),published:lpublished.checked};if(!row.title||!row.youtube_url)return say('Lecture title and YouTube URL are required.');const {error}=await sb.from('lectures').insert(row);if(error)say(error.message);else{say('Lecture added.');['ltitle','lsubject','ltopic','lyoutube'].forEach(id=>document.getElementById(id).value='');loadAll()}};document.getElementById('addExplain').onclick=async()=>{const row={title:etitle.value.trim(),subject:esubject.value.trim(),topic:etopic.value.trim(),youtube_url:eyoutube.value.trim(),description:edescription.value.trim(),published:epublished.checked};if(!row.title||!row.youtube_url)return say('Explain title and YouTube URL are required.');const {error}=await sb.from('explains').insert(row);if(error)say(error.message);else{say('Marmuz Explain added.');['etitle','esubject','etopic','eyoutube','edescription'].forEach(id=>document.getElementById(id).value='');loadAll()}};document.getElementById('addResource').onclick=async()=>{const row={title:rtitle.value.trim(),subject:rsubject.value.trim(),type:rtype.value,url:rurl.value.trim(),published:rpublished.checked};if(!row.title||!row.url)return say('Resource title and URL are required.');const {error}=await sb.from('resources').insert(row);if(error)say(error.message);else{say('Resource added.');['rtitle','rsubject','rurl'].forEach(id=>document.getElementById(id).value='');loadAll()}};document.getElementById('logout').onclick=async()=>{if(sb)await sb.auth.signOut();location.href='login.html'};document.getElementById('home').onclick=()=>location.href='index.html';boot();</script></body></html>
